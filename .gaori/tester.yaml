version: 2
commands:
  manifest-check:
    command: ["make", "manifest-check"]
    tags: [docs, manifest]
    parser: generic
    timeout_sec: 300
  schema-validation:
    command: ["make", "schema-validation"]
    tags: [docs, schema]
    parser: generic
    timeout_sec: 300
  traceability:
    command: ["make", "traceability"]
    tags: [docs, traceability]
    parser: generic
    timeout_sec: 120
